<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cartera de préstamos</title>
<meta name="theme-color" id="tc" content="#f2f4f1">
<link rel="icon" id="fav" type="image/png" href="icons/favicon-64.png?v=7">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Préstamos">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--card:#fff;--ink:#14312b;--mut:#5c6f69;--line:#dbe2de;--acc:#14594a;--acc2:#c98a1b;--bad:#b3342b;--ok:#1d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-mode="dark"]{--bg:#0f1b18;--card:#172722;--ink:#e6efeb;--mut:#92a8a0;--line:#2a3d37;--acc:#4fb596;--acc2:#e0a73c;--bad:#ef7b70;--ok:#5cc596;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px;font-weight:800}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:1.4rem;font-weight:800}
.stat span{color:var(--mut);font-size:.88rem}
.stat.bad b{color:var(--bad)}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:grid;gap:3px;font-size:.88rem;color:var(--mut)}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.pct{border:2px solid var(--acc2);border-radius:10px;padding:8px;background:color-mix(in srgb,var(--acc2) 10%,transparent)}
.pct span{color:var(--ink);font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.full{grid-column:1/-1}
.prev{background:var(--bg);border-radius:8px;padding:10px;font-size:.95rem}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right}
.tag{padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--line)}
.tag.mora{background:var(--bad);color:#fff}.tag.pagado{background:var(--ok);color:#fff}.tag.activo{background:var(--acc2);color:#1b1300}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row small{color:var(--mut);display:block}
a.lk{color:var(--acc);cursor:pointer;font-weight:700;text-decoration:underline}
dialog{max-width:760px;width:calc(100% - 24px);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.tag{white-space:nowrap}textarea{resize:vertical}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.brand img{width:52px;height:52px;flex:none}.brand h1{margin:0}.brand .sub{margin:0}
:root[data-accent=azul]{--acc:#1f5fbf}:root[data-accent=violeta]{--acc:#6d3fc0}:root[data-accent=rosa]{--acc:#c2255c}:root[data-accent=naranja]{--acc:#c25b00}
:root[data-accent=azul][data-mode=dark]{--acc:#6aa6ff}:root[data-accent=violeta][data-mode=dark]{--acc:#a98bff}:root[data-accent=rosa][data-mode=dark]{--acc:#ff7aa8}:root[data-accent=naranja][data-mode=dark]{--acc:#ff9a4d}
:root[data-mode=dark] .btn:not(.ghost),:root[data-mode=dark] nav button.on{color:#0b1512}
:root[data-bg=degradado] body{background:linear-gradient(160deg,var(--bg) 40%,color-mix(in srgb,var(--acc) 22%,var(--bg))) fixed}
:root[data-bg=cuadricula] body{background:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1px,transparent 1.3px) 0 0/18px 18px,var(--bg)}
.card.alert{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 12%,var(--card))}.card.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok);margin-bottom:10px}
.sw{display:flex;gap:10px;margin-top:6px}.swb{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swb.on{border-color:var(--ink)}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;padding:20px}#lock[hidden]{display:none}.lbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center}.lbox form{grid-template-columns:1fr;width:100%;text-align:left}.lbox h2{margin:0}body.locked main{display:none}.row span{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.empty{color:var(--mut);padding:8px 0}
.note{font-size:.85rem;color:var(--mut)}
@media print{nav,.btn,form{display:none}body{background:#fff}body.rcp main,body.rcp #dlg{display:none!important}#rc{position:static;border:0;color:#000;background:#fff;max-width:none;width:100%}#rc .noprint{display:none}}
.rbox{border:2px dashed var(--line);padding:16px;border-radius:8px}.rbox table td{border:0;padding:4px 0}.firma{margin-top:44px;border-top:1px solid currentColor;width:240px;padding-top:4px;font-size:.85rem}
.tgl{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}.tgl svg{width:22px;height:22px}
.wa{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#25D366;color:#fff;vertical-align:middle;text-decoration:none}.wa svg{width:20px;height:20px;fill:#fff}.wa.off{background:var(--line);pointer-events:none}
.card.late{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}.card.late h2{color:var(--bad)}
tr.okr{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:700}tr.later{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line)}.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.y{background:var(--acc2)}
.brand .tgl+*{}
</style>
</head>

<nav id="nav"></nav>

</main>

function addDate(iso,k,f){const d=new Date(iso+'T12:00:00');if(f==='m')d.setMonth(d.getMonth()+k);else d.setDate(d.getDate()+k*DAYS[f]);return d.toISOString().slice(0,10)}
function calc(p){
  const n=+p.n,P=+p.monto,r=+p.tasa/100,dd=DAYS[p.freq],rows=[];
  if(!(n>0&&P>0))return rows;
  if(p.metodo==='simple'){
    const ci=P/n,ii=P*r*(n*dd/30)/n;
    for(let k=1;k<=n;k++)rows.push({k,date:addDate(p.fecha,k,p.freq),cap:ci,int:ii,tot:ci+ii});
  }else{
    const i=r*dd/30,c=i?P*i/(1-Math.pow(1+i,-n)):P/n;let b=P;
    for(let k=1;k<=n;k++){const it=b*i,cp=c-it;b-=cp;rows.push({k,date:addDate(p.fecha,k,p.freq),cap:cp,int:it,tot:c})}
  }
  return rows;
}
function sched(l){
  const rows=calc(l);let rem=S.pays.filter(x=>x.loan===l.id).reduce((a,x)=>a+x.amt,0);
  const paid=rem;
  rows.forEach(r=>{r.paid=Math.min(rem,r.tot);rem-=r.paid;r.late=r.paid<r.tot-.5&&r.date<today()});
  const total=rows.reduce((a,r)=>a+r.tot,0);
  const intTot=rows.reduce((a,r)=>a+r.int,0);
  const intPaid=rows.reduce((a,r)=>a+(r.tot?r.paid*r.int/r.tot:0),0);
  let mora=0;
  rows.filter(r=>r.late).forEach(r=>{const d=(new Date(today())-new Date(r.date))/864e5;mora+=(r.tot-r.paid)*(+l.mora||0)/100*d/30});
  const done=paid>=total-.5;
  const st=done?'pagado':rows.some(r=>r.late)?'mora':'activo';
  return{rows,paid,total,saldo:Math.max(0,total-paid),intTot,intPaid,mora,st,overdue:rows.filter(r=>r.late).reduce((a,r)=>a+r.tot-r.paid,0)};
}

  $('#fg').onclick=()=>lock(mode==='in'?'rec':'in');
  $('#lf').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),m=$('#lm');
    if(mode==='in'){if(await hs(f.p,SEC.salt,SEC.alg)===SEC.h){sessionStorage.setItem('unl','1');unlock()}else m.textContent='Contraseña incorrecta.'}
    else if(await hs(f.c,SEC.salt,SEC.alg)===SEC.r){await setSec(f.p,f.c);sessionStorage.setItem('unl','1');unlock()}else m.textContent='Código incorrecto.'};
}
function unlock(){$('#lock').hidden=true;document.body.classList.remove('locked');render();startAlerts()}
function boot(){applyTheme();$('#tg').onclick=toggleTheme;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});let u=false;try{u=sessionStorage.getItem('unl')}catch(e){}if(SEC&&!u)lock('in');else unlock()}
document.addEventListener('input',e=>{if(e.target.id==='biz'){S.biz=e.target.value;save()}});
boot();
</script>
</body>
