<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cartera de préstamos</title>
<meta name="theme-color" id="tc" content="#f2f4f1">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--card:#fff;--ink:#14312b;--mut:#5c6f69;--line:#dbe2de;--acc:#14594a;--acc2:#c98a1b;--bad:#b3342b;--ok:#1d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-mode="dark"]{--bg:#0f1b18;--card:#172722;--ink:#e6efeb;--mut:#92a8a0;--line:#2a3d37;--acc:#4fb596;--acc2:#e0a73c;--bad:#ef7b70;--ok:#5cc596;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px;font-weight:800}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font-size:1.4rem;font-weight:800}
.stat span{color:var(--mut);font-size:.88rem}
.stat.bad b{color:var(--bad)}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:grid;gap:3px;font-size:.88rem;color:var(--mut)}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.pct{border:2px solid var(--acc2);border-radius:10px;padding:8px;background:color-mix(in srgb,var(--acc2) 10%,transparent)}
.pct span{color:var(--ink);font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.full{grid-column:1/-1}
.prev{background:var(--bg);border-radius:8px;padding:10px;font-size:.95rem}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right}
.tag{padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--line)}
.tag.mora{background:var(--bad);color:#fff}.tag.pagado{background:var(--ok);color:#fff}.tag.activo{background:var(--acc2);color:#1b1300}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row small{color:var(--mut);display:block}
a.lk{color:var(--acc);cursor:pointer;font-weight:700;text-decoration:underline}
dialog{max-width:760px;width:calc(100% - 24px);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.tag{white-space:nowrap}textarea{resize:vertical}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.brand img{width:52px;height:52px;flex:none}.brand h1{margin:0}.brand .sub{margin:0}
:root[data-accent=azul]{--acc:#1f5fbf}:root[data-accent=violeta]{--acc:#6d3fc0}:root[data-accent=rosa]{--acc:#c2255c}:root[data-accent=naranja]{--acc:#c25b00}
:root[data-accent=azul][data-mode=dark]{--acc:#6aa6ff}:root[data-accent=violeta][data-mode=dark]{--acc:#a98bff}:root[data-accent=rosa][data-mode=dark]{--acc:#ff7aa8}:root[data-accent=naranja][data-mode=dark]{--acc:#ff9a4d}
:root[data-mode=dark] .btn:not(.ghost),:root[data-mode=dark] nav button.on{color:#0b1512}
:root[data-bg=degradado] body{background:linear-gradient(160deg,var(--bg) 40%,color-mix(in srgb,var(--acc) 22%,var(--bg))) fixed}
:root[data-bg=cuadricula] body{background:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1px,transparent 1.3px) 0 0/18px 18px,var(--bg)}
.card.alert{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 12%,var(--card))}.card.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok);margin-bottom:10px}
.sw{display:flex;gap:10px;margin-top:6px}.swb{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swb.on{border-color:var(--ink)}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;padding:20px}#lock[hidden]{display:none}.lbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center;display:grid;gap:12px;justify-items:center}.lbox form{grid-template-columns:1fr;width:100%;text-align:left}.lbox h2{margin:0}body.locked main{display:none}.row span{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.empty{color:var(--mut);padding:8px 0}
.note{font-size:.85rem;color:var(--mut)}
@media print{nav,.btn,form{display:none}body{background:#fff}body.rcp main,body.rcp #dlg{display:none!important}#rc{position:static;border:0;color:#000;background:#fff;max-width:none;width:100%}#rc .noprint{display:none}}
.rbox{border:2px dashed var(--line);padding:16px;border-radius:8px}.rbox table td{border:0;padding:4px 0}.firma{margin-top:44px;border-top:1px solid currentColor;width:240px;padding-top:4px;font-size:.85rem}
.tgl{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}.tgl svg{width:22px;height:22px}
.wa{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#25D366;color:#fff;vertical-align:middle;text-decoration:none}.wa svg{width:20px;height:20px;fill:#fff}.wa.off{background:var(--line);pointer-events:none}
.card.late{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}.card.late h2{color:var(--bad)}
tr.okr{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:700}tr.later{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line)}.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.y{background:var(--acc2)}
.brand .tgl+*{}
.ib{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}.ib img{width:44px;height:44px;border-radius:10px;flex:none}.ib div{flex:1;font-size:.92rem;line-height:1.3}.ib .x{background:none;border:0;color:var(--ink);font-size:1.3rem;cursor:pointer;padding:4px 8px}.dg li{list-style:none;margin:6px 0}.dg ul{padding:0;margin:0}
</style>

<link rel="icon" id="fav" type="image/png" sizes="48x48" href="icon-48.png?v=10">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=10">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=10">

<main>
<header class="brand"><img id="lg" alt="Logo Préstamos y Cobros" width="52" height="52"><div><h1>Mi cartera de préstamos</h1>

<nav id="nav"></nav>

async function hs(t,salt,alg){const d=salt+'|'+t;if(alg==='sha'){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of d)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h.toString(16)}
async function setSec(p,c){const alg=window.crypto&&crypto.subtle?'sha':'f',salt=uid()+uid();SEC={salt,alg,h:await hs(p,salt,alg),r:await hs(c,salt,alg)};localStorage.setItem(SK,JSON.stringify(SEC))}

function addDate(iso,k,f){const d=new Date(iso+'T12:00:00');if(f==='m')d.setMonth(d.getMonth()+k);else d.setDate(d.getDate()+k*DAYS[f]);return d.toISOString().slice(0,10)}
function calc(p){
  const n=+p.n,P=+p.monto,r=+p.tasa/100,dd=DAYS[p.freq],rows=[];
  if(!(n>0&&P>0))return rows;
  if(p.metodo==='simple'){
    const ci=P/n,ii=P*r*(n*dd/30)/n;
    for(let k=1;k<=n;k++)rows.push({k,date:addDate(p.fecha,k,p.freq),cap:ci,int:ii,tot:ci+ii});
  }else{
    const i=r*dd/30,c=i?P*i/(1-Math.pow(1+i,-n)):P/n;let b=P;
    for(let k=1;k<=n;k++){const it=b*i,cp=c-it;b-=cp;rows.push({k,date:addDate(p.fecha,k,p.freq),cap:cp,int:it,tot:c})}
  }
  return rows;
}
function sched(l){
  const rows=calc(l);let rem=S.pays.filter(x=>x.loan===l.id).reduce((a,x)=>a+x.amt,0);
  const paid=rem;
  rows.forEach(r=>{r.paid=Math.min(rem,r.tot);rem-=r.paid;r.late=r.paid<r.tot-.5&&r.date<today()});
  const total=rows.reduce((a,r)=>a+r.tot,0);
  const intTot=rows.reduce((a,r)=>a+r.int,0);
  const intPaid=rows.reduce((a,r)=>a+(r.tot?r.paid*r.int/r.tot:0),0);
  let mora=0;
  rows.filter(r=>r.late).forEach(r=>{const d=(new Date(today())-new Date(r.date))/864e5;mora+=(r.tot-r.paid)*(+l.mora||0)/100*d/30});
  const done=paid>=total-.5;
  const st=done?'pagado':rows.some(r=>r.late)?'mora':'activo';
  return{rows,paid,total,saldo:Math.max(0,total-paid),intTot,intPaid,mora,st,overdue:rows.filter(r=>r.late).reduce((a,r)=>a+r.tot-r.paid,0)};
}

function showBanner(){if(isApp()||$('#ib'))return;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(!DIP&&!ios)return;try{if(sessionStorage.getItem('ib'))return}catch(e){}

async function diag(){const el=$('#dg');if(!el)return;const L=[],ok=(t,v,h)=>L.push('<li>'+(v?'✅ ':'❌ ')+t+(v||!h?'':'<br><small>'+h+'</small>')+'</li>');
ok('Dirección segura (https)',window.isSecureContext,'Abre la app desde la dirección https de GitHub Pages, no desde el archivo guardado.');
let sw=false;try{sw=!!(await navigator.serviceWorker.getRegistration())}catch(e){}ok('Modo sin conexión (service worker) activo',sw,'Recarga la página una vez; si sigue así, sube también el archivo sw.js.');
let mj=null;try{const h=document.querySelector('link[rel=manifest]').href;mj=await (await fetch(h)).json()}catch(e){}ok('Archivo manifest.webmanifest cargado',!!mj,'Sube el archivo manifest.webmanifest a la misma carpeta que index.html.');
for(const z of ['192x192','512x512']){let g=false;try{const ic=mj.icons.find(x=>x.sizes===z&&x.purpose==='any');g=(await fetch(new URL(ic.src,document.baseURI))).ok}catch(e){}ok('Icono de '+z.split('x')[0]+' px encontrado',g,'Sube los archivos icon-192.png e icon-512.png junto a index.html (sin carpetas).')}
L.push('<li>'+(isApp()?'✅ App instalada en este dispositivo':'ℹ️ Aún no instalada en este dispositivo')+'</li>');
el.innerHTML='<ul>'+L.join('')+'</ul>'}
function overdueList(){const o=[];S.loans.forEach(l=>{const s=sched(l);if(s.st==='mora')o.push({l,s,v:s.overdue})});return o}
function dueTom(){const t=addDate(today(),1,'d'),o=[];S.loans.forEach(l=>sched(l).rows.forEach(r=>{if(r.date===t&&r.paid<r.tot-.5)o.push({l,r,v:r.tot-r.paid})}));return o}
function notify(){if(!S.cfg.notif||!('Notification'in window)||Notification.permission!=='granted')return;const t=dueTom(),m=overdueList();if(!t.length&&!m.length||S.cfg.lastN===today())return;S.cfg.lastN=today();save();const b=[];if(t.length)b.push('Mañana vencen: '+t.map(x=>cname(x.l.client)+' '+fmt(x.v)).join(', '));if(m.length)b.push('Pagos vencidos: '+m.map(x=>cname(x.l.client)+' '+fmt(x.v)).join(', '));const ti=m.length?'Cobros: hay pagos vencidos':'Cobros de mañana',o={body:b.join('\n'),icon:IC.l},n=()=>new Notification(ti,o);navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration().then(g=>g?g.showNotification(ti,o):n()).catch(n):n()}
function enableNotif(){if(!('Notification'in window)){alert('Tu navegador no admite notificaciones.');return}Notification.requestPermission().then(p=>{S.cfg.notif=p==='granted';save();if(p==='granted'){alert('Listo. Te avisaré un día antes de cada cobro mientras la app esté abierta o instalada.');notify()}else alert('No diste permiso. Puedes activarlo desde los ajustes del navegador.');render()})}
const startAlerts=()=>{notify();setInterval(notify,18e5)};
const cname=id=>(S.clients.find(c=>c.id===id)||{nombre:'(eliminado)'}).nombre;

function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function render(){nav();({panel,clientes,prestamos,capital,reportes,ajustes})[tab]()}

function panel(){
  const L=S.loans.map(l=>({l,s:sched(l)}));
  const prest=S.loans.reduce((a,l)=>a+ +l.monto,0),rec=L.reduce((a,x)=>a+x.s.paid,0),saldo=L.reduce((a,x)=>a+x.s.saldo,0),gan=L.reduce((a,x)=>a+x.s.intPaid,0);
  const m=L.filter(x=>x.s.st==='mora');
  const lim=addDate(today(),7,'d'),up=L.map(x=>{const r=x.s.rows.find(r=>r.paid<r.tot-.5&&r.date>=today()&&r.date<=lim);return r?{l:x.l,r}:null}).filter(Boolean).sort((a,b)=>a.r.date.localeCompare(b.r.date));
  const oldBk=S.loans.length&&(!S.lastBackup||(new Date(today())-new Date(S.lastBackup))/864e5>7);
  const tom=dueTom(),lateHtml=m.length?`<div class="card late"><h2>⚠ ${m.length} préstamo(s) con pagos vencidos</h2>${m.map(x=>`<div class="row"><div><b>${esc(cname(x.l.client))}</b><small>Vencido: ${fmt(x.s.overdue)}</small></div><span>${waA(x.l.client,'Hola '+cname(x.l.client)+', le recordamos que tiene un pago vencido de '+fmt(x.s.overdue)+'. Por favor comuníquese para ponerse al día.',x.l)} <a class="lk" data-open="${x.l.id}">Ver</a></span></div>`).join('')}</div>`:'',tomHtml=tom.length?`<div class="card alert"><h2>Mañana vencen ${tom.length} cobro(s)</h2>${tom.map(x=>`<div class="row"><div>${esc(cname(x.l.client))}<small>Cuota ${x.r.k}: ${fmt(x.v)}</small></div><span>${waA(x.l.client,'Hola '+cname(x.l.client)+', le recordamos que mañana vence su cuota de '+fmt(x.v)+'. ¡Gracias!',x.l)} <a class="lk" data-open="${x.l.id}">Ver</a></span></div>`).join('')}</div>`:'';
  const ntBtn=('Notification'in window&&!S.cfg.notif)?'<div class="card"><button class="btn" id="nt">Activar aviso un día antes del cobro</button> <span class="note">El aviso aparece cuando la app está abierta o instalada.</span></div>':'';
  $('#v').innerHTML=`<div class="grid">
  <div class="card stat"><b>${fmt(prest)}</b><span>Total prestado</span></div>
  <div class="card stat"><b>${fmt(rec)}</b><span>Total recuperado</span></div>
  <div class="card stat"><b>${fmt(saldo)}</b><span>Saldo pendiente</span></div>
  <div class="card stat"><b>${fmt(gan)}</b><span>Intereses ganados</span></div>
  <div class="card stat bad"><b>${m.length}</b><span>Préstamos en mora</span></div><div class="card stat"><b>${L.filter(x=>x.s.st==='pagado').length}</b><span>Préstamos finalizados</span></div>${S.cap.length?`<div class="card stat"><b>${fmt(capStats().caja)}</b><span>Disponible en caja</span></div>`:''}</div>
  ${lateHtml}${tomHtml}${ntBtn}${installHtml(false)}
  ${oldBk?'<div class="card note">Hace más de 7 días que no haces un respaldo. Ve a Reportes y pulsa Exportar respaldo.</div>':''}
  <div class="card"><label>Nombre de tu negocio o tu nombre (aparece en los recibos)<input id="biz" value="${esc(S.biz||'')}" placeholder="Ej: Préstamos Don Carlos"></label></div>
  <div class="card"><h2>Cobros vencidos</h2>${m.length?m.map(x=>`<div class="row"><div>${esc(cname(x.l.client))}<small>Vencido: ${fmt(x.s.overdue)} · Mora estimada: ${fmt(x.s.mora)}</small></div><span>${waA(x.l.client,'Hola '+cname(x.l.client)+', le recordamos que tiene un pago vencido de '+fmt(x.s.overdue)+'. Por favor comuníquese para ponerse al día.',x.l)} <a class="lk" data-open="${x.l.id}">Ver préstamo</a></span></div>`).join(''):'<p class="empty">No tienes cuotas vencidas.</p>'}</div>
  <div class="card"><h2>Próximos cobros (7 días)</h2>${up.length?up.map(x=>{const v=x.r.tot-x.r.paid;return`<div class="row"><div>${esc(cname(x.l.client))}<small>${x.r.date===today()?'Hoy':x.r.date} · Cuota ${x.r.k}: ${fmt(v)}</small></div><span>${waA(x.l.client,'Hola '+cname(x.l.client)+', le recordamos que su cuota de '+fmt(v)+' vence el '+x.r.date+'. ¡Gracias!',x.l)} <a class="lk" data-open="${x.l.id}">Ver</a></span></div>`}).join(''):'<p class="empty">No hay cobros en los próximos 7 días.</p>'}</div>
  ${S.clients.length?'':'<div class="card"><p class="empty">Empieza creando tu primer cliente en la pestaña Clientes.</p></div>'}`;
  bindOpen();
  const nt=$('#nt');if(nt)nt.onclick=enableNotif;bindInstall();
}

let q={c:'',l:'',st:''},editC=null;
function clientes(){
  const e=S.clients.find(c=>c.id===editC)||{};
  $('#v').innerHTML=`<div class="card"><h2>${e.id?'Editar cliente':'Nuevo cliente'}</h2><form id="fc">
  <label>Nombre<input name="nombre" required value="${esc(e.nombre)}"></label><label>Teléfono<input name="tel" inputmode="tel" value="${esc(e.tel)}"></label>
  <label>Documento<input name="doc" value="${esc(e.doc)}"></label><label>Dirección<input name="dir" value="${esc(e.dir)}"></label>
  <label class="full">Notas u observaciones<textarea name="nota" rows="2">${esc(e.nota)}</textarea></label>
  <div class="full"><button class="btn">${e.id?'Guardar cambios':'Guardar cliente'}</button>${e.id?' <button type="button" class="btn ghost" id="ce">Cancelar</button>':''}</div></form></div>
  <div class="card"><h2>Tus clientes</h2><input id="qc" type="search" placeholder="Buscar por nombre, teléfono o documento" value="${esc(q.c)}" style="margin-bottom:8px"><div id="lc"></div></div>`;
  $('#fc').onsubmit=ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));if(e.id)Object.assign(e,f);else S.clients.push({id:uid(),...f});editC=null;save();render()};
  if(e.id)$('#ce').onclick=()=>{editC=null;render()};
  $('#qc').oninput=ev=>{q.c=ev.target.value;drawC()};
  drawC();
}
function drawC(){
  const t=q.c.toLowerCase(),L=S.clients.filter(c=>[c.nombre,c.tel,c.doc].join(' ').toLowerCase().includes(t));
  $('#lc').innerHTML=L.length?L.map(c=>{
    const ls=S.loans.filter(l=>l.client===c.id).map(sched),mo=ls.filter(s=>s.st==='mora').length;
    const cal=!ls.length?'Sin historial':mo?'Con mora':ls.every(s=>s.st==='pagado')?'Al día · sin deudas':'Al día';
    return`<div class="row"><div><b>${esc(c.nombre)}</b><small>${esc(c.tel)} · Doc. ${esc(c.doc)} · ${esc(c.dir)}</small><small>${ls.length} préstamo(s) · ${cal}</small>${c.nota?'<small>Nota: '+esc(c.nota)+'</small>':''}</div><span><a class="lk" data-ed="${c.id}">Editar</a> · <a class="lk" data-del="${c.id}">Eliminar</a></span></div>`}).join(''):`<p class="empty">${S.clients.length?'Sin resultados.':'Aún no hay clientes.'}</p>`;
  document.querySelectorAll('[data-ed]').forEach(a=>a.onclick=()=>{editC=a.dataset.ed;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-del]').forEach(a=>a.onclick=()=>{const id=a.dataset.del;if(S.loans.some(l=>l.client===id)){alert('Este cliente tiene préstamos y no se puede eliminar.');return}if(confirm('¿Eliminar cliente?')){S.clients=S.clients.filter(c=>c.id!==id);save();render()}});
}

function prestamos(){
  const opts=S.clients.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  $('#v').innerHTML=`<div class="card"><h2>Nuevo préstamo</h2>${S.clients.length?`<form id="fl">
  <label>Cliente<select name="client" required>${opts}</select></label>
  <label>Monto prestado ($)<input name="monto" type="number" min="1" step="any" required></label>
  <label class="pct"><span>Porcentaje de interés (% por mes)</span><input name="tasa" type="number" min="0" step="0.01" value="10" required></label>
  <label>Tipo de interés<select name="metodo"><option value="simple">Simple sobre el capital</option><option value="saldo">Sobre saldo (cuota fija)</option></select></label>
  <label>Número de cuotas<input name="n" type="number" min="1" step="1" value="4" required></label>
  <label>Frecuencia de pago<select name="freq">${Object.entries(FN).map(([k,v])=>`<option value="${k}" ${k==='m'?'selected':''}>${v}</option>`).join('')}</select></label>
  <label>Fecha del préstamo<input name="fecha" type="date" value="${today()}" required></label>
  <label>Interés por mora (% por mes)<input name="mora" type="number" min="0" step="0.01" value="0"></label>
  <label class="full">Observaciones<textarea name="obs" rows="2"></textarea></label>
  <label class="full">Mensaje opcional para el cliente (se agrega a los avisos de WhatsApp)<textarea name="msg" rows="2" placeholder="Ej: Puede pagar por Nequi o Bancolombia."></textarea></label>
  <div class="full prev" id="pv"></div>
  <div class="full note">Verifica que tu tasa no supere la máxima legal (usura) vigente en Colombia.</div>
  <div class="full"><button class="btn">Crear préstamo</button></div></form>`:'<p class="empty">Primero crea un cliente.</p>'}</div>
  <div class="card"><h2>Préstamos</h2><div class="grid" style="margin-bottom:8px"><input id="ql" type="search" placeholder="Buscar por cliente" value="${esc(q.l)}"><select id="sl"><option value="">Todos los estados</option>${[['activo','Activos'],['mora','En mora'],['pagado','Finalizados']].map(o=>`<option value="${o[0]}" ${q.st===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div id="ll"></div></div>`;
  drawL();
  $('#ql').oninput=ev=>{q.l=ev.target.value;drawL()};
  $('#sl').onchange=ev=>{q.st=ev.target.value;drawL()};
  const f=$('#fl');if(!f)return;
  const pv=()=>{const p=Object.fromEntries(new FormData(f)),r=calc(p);
    $('#pv').innerHTML=r.length?`Cuota: <b>${fmt(r[0].tot)}</b> · Interés total: <b>${fmt(r.reduce((a,x)=>a+x.int,0))}</b> · Total a pagar: <b>${fmt(r.reduce((a,x)=>a+x.tot,0))}</b> · Último pago: ${r[r.length-1].date}${S.cap.length?' · Disponible en caja: <b>'+fmt(capStats().caja)+'</b>':''}`:'Completa monto y cuotas para ver el cálculo.'};
  f.oninput=pv;pv();
  f.onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(f));if(S.cap.length){const cs=capStats();if(+p.monto>cs.caja&&!confirm('Este préstamo ('+fmt(p.monto)+') supera tu capital disponible ('+fmt(cs.caja)+'). ¿Crearlo de todas formas?'))return}S.loans.push({id:uid(),...p});save();render()};
}

function drawL(){
  const t=q.l.toLowerCase(),R=S.loans.map(l=>({l,s:sched(l)})).filter(x=>cname(x.l.client).toLowerCase().includes(t)&&(!q.st||x.s.st===q.st));
  $('#ll').innerHTML=R.length?`<div class="wrap"><table><tr><th>Cliente</th><th class="n">Monto</th><th class="n">Tasa</th><th class="n">Saldo</th><th>Próx. pago</th><th>Estado</th><th></th></tr>${R.map(({l,s})=>{const nx=s.rows.find(r=>r.paid<r.tot-.5),late=s.st==='mora',dn=s.st==='pagado',soon=nx&&!late&&nx.date<=addDate(today(),1,'d'),msg=late?'Hola '+cname(l.client)+', le recordamos que tiene un pago vencido de '+fmt(s.overdue)+'. Por favor comuníquese para ponerse al día.':nx?'Hola '+cname(l.client)+', le recordamos que su cuota de '+fmt(nx.tot-nx.paid)+' vence el '+nx.date+'. ¡Gracias!':'';return`<tr class="${dn?'okr':late?'later':''}"><td>${esc(cname(l.client))}</td><td class="n">${fmt(l.monto)}</td><td class="n">${l.tasa}%</td><td class="n">${fmt(s.saldo)}</td><td><span class="dot ${dn?'g':late?'r':soon?'y':''}"></span>${dn?'Pagado':nx?nx.date:'—'}</td><td><span class="tag ${s.st}">${LBL[s.st]}</span></td><td>${msg?waA(l.client,msg,l)+' ':''}<a class="lk" data-open="${l.id}">Abrir</a></td></tr>`}).join('')}</table></div>`:`<p class="empty">${S.loans.length?'Sin resultados.':'Aún no hay préstamos.'}</p>`;
  bindOpen();
}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(a=>a.onclick=()=>openLoan(a.dataset.open))}
function openLoan(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;const s=sched(l),d=$('#dlg');
  d.innerHTML=`<h2>${esc(cname(l.client))} · ${fmt(l.monto)} al ${l.tasa}% mensual</h2>
  <p class="note">${l.metodo==='simple'?'Interés simple':'Interés sobre saldo'} · ${l.n} cuotas ${FN[l.freq].toLowerCase()}s · <span class="tag ${s.st}">${LBL[s.st]}</span></p>
  ${s.st==='pagado'?'<div class="card ok"><b>✓ Préstamo finalizado.</b> El cliente está al día y no tiene deuda pendiente.</div>':''}${s.st==='mora'?`<div class="card late"><b>⚠ Pago vencido:</b> ${fmt(s.overdue)} ${waA(l.client,'Hola '+cname(l.client)+', le recordamos que tiene un pago vencido de '+fmt(s.overdue)+'. Por favor comuníquese para ponerse al día.',l)}</div>`:''}<label style="margin-bottom:10px">Observaciones del préstamo<textarea id="lob" rows="2">${esc(l.obs)}</textarea></label><label style="margin-bottom:10px">Mensaje opcional para el cliente (se agrega a los avisos de WhatsApp)<textarea id="lmsg" rows="2" placeholder="Ej: Puede pagar por Nequi o Bancolombia.">${esc(l.msg)}</textarea></label>
  <div class="grid" style="margin-bottom:12px"><div class="stat"><b>${fmt(s.total)}</b><span>Total a pagar</span></div><div class="stat"><b>${fmt(s.paid)}</b><span>Pagado</span></div><div class="stat"><b>${fmt(s.saldo)}</b><span>Saldo</span></div><div class="stat"><b>${fmt(s.mora)}</b><span>Mora estimada</span></div></div>
  <div class="wrap"><table><tr><th>#</th><th>Fecha</th><th class="n">Capital</th><th class="n">Interés</th><th class="n">Cuota</th><th class="n">Pagado</th><th>Estado</th><th></th></tr>${s.rows.map(r=>{const ok=r.paid>=r.tot-.5,ab=r.paid>0&&!ok;return`<tr class="${ok?'okr':r.late?'later':''}"><td>${r.k}</td><td>${r.date}</td><td class="n">${fmt(r.cap)}</td><td class="n">${fmt(r.int)}</td><td class="n">${fmt(r.tot)}</td><td class="n" style="${r.paid>0?'color:var(--ok);font-weight:700':''}">${fmt(r.paid)}</td><td><span class="tag ${ok?'pagado':ab?'activo':r.late?'mora':''}">${ok?'✓ Pagada':ab?'Abonó':r.late?'Atrasada':'Pendiente'}</span></td><td>${ok?'':waA(l.client,r.late?'Hola '+cname(l.client)+', su cuota '+r.k+' de '+fmt(r.tot-r.paid)+' venció el '+r.date+'. Por favor comuníquese para ponerse al día.':'Hola '+cname(l.client)+', le recordamos que su cuota '+r.k+' de '+fmt(r.tot-r.paid)+' vence el '+r.date+'. ¡Gracias!',l)}</td></tr>`}).join('')}</table></div>
  <h2 style="margin-top:14px">Registrar pago o abono</h2>
  <form id="fp"><label>Valor ($)<input name="amt" type="number" min="1" step="any" required></label><label>Fecha<input name="date" type="date" value="${today()}" required></label><label class="full">Nota (opcional)<input name="nota"></label><div class="full"><button class="btn">Guardar pago</button> <button type="button" class="btn ghost" id="cl">Cerrar</button> <button type="button" class="btn ghost" id="dl">Eliminar préstamo</button></div></form>
  <h2 style="margin-top:14px">Pagos registrados</h2>${S.pays.filter(p=>p.loan===id).map(p=>`<div class="row"><div><span class="tag pagado">✓ Pagó</span> ${p.date} · <b style="color:var(--ok)">${fmt(p.amt)}</b>${p.nota?'<small>'+esc(p.nota)+'</small>':''}</div><span><a class="lk" data-rc="${p.id}">Recibo</a> · <a class="lk" data-pe="${p.id}">Editar</a> · <a class="lk" data-pd="${p.id}">Eliminar</a></span></div>`).join('')||'<p class="empty">Ninguno todavía.</p>'}`;
  d.showModal();
  d.querySelectorAll('[data-rc]').forEach(a=>a.onclick=()=>receipt(a.dataset.rc));
  d.querySelectorAll('[data-pe]').forEach(a=>a.onclick=()=>{const p=S.pays.find(x=>x.id===a.dataset.pe),v=prompt('Valor del pago ($):',p.amt);if(v===null)return;const n=+v;if(!(n>0)){alert('Valor inválido.');return}const dt=prompt('Fecha (AAAA-MM-DD):',p.date);if(dt&&/^\d{4}-\d{2}-\d{2}$/.test(dt))p.date=dt;p.amt=n;save();openLoan(id);render()});
  d.querySelectorAll('[data-pd]').forEach(a=>a.onclick=()=>{if(confirm('¿Eliminar este pago?')){S.pays=S.pays.filter(x=>x.id!==a.dataset.pd);save();openLoan(id);render()}});
  $('#lob').onchange=e=>{l.obs=e.target.value;save()};
  $('#lmsg').onchange=e=>{l.msg=e.target.value;save();openLoan(id)};
  $('#cl').onclick=()=>{d.close();render()};
  $('#dl').onclick=()=>{if(confirm('¿Eliminar este préstamo y sus pagos?')){S.loans=S.loans.filter(x=>x.id!==id);S.pays=S.pays.filter(p=>p.loan!==id);save();d.close();render()}};
  $('#fp').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.nextNo=Math.max(S.nextNo||0,S.pays.length)+1;S.pays.push({id:uid(),loan:id,amt:+f.amt,date:f.date,nota:f.nota||'',no:S.nextNo});save();openLoan(id);render()};
}

function receipt(pid){
  const p=S.pays.find(x=>x.id===pid),l=S.loans.find(x=>x.id===p.loan),c=S.clients.find(x=>x.id===l.client)||{},s=sched(l);
  const ant=S.pays.filter(x=>x.loan===l.id);const upto=ant.slice(0,ant.indexOf(p)+1).reduce((a,x)=>a+x.amt,0);
  const num=String(p.no||S.pays.indexOf(p)+1).padStart(5,'0'),r=$('#rc');
  const tel=String(c.tel||'').replace(/\D/g,''),saldoP=Math.max(0,s.total-upto);
  const wt=(S.biz?S.biz+'\n':'')+'Recibo de pago N.º '+num+'\nFecha: '+p.date+'\nCliente: '+(c.nombre||'')+'\nValor recibido: '+fmt(p.amt)+'\nSaldo pendiente: '+fmt(saldoP)+'\nGracias por su pago.';
  const wa='https://wa.me/'+(tel.length===10?'57'+tel:tel)+'?text='+encodeURIComponent(wt);
  r.innerHTML=`<div class="rbox"><img src="${IC[curMode()==='dark'?'d':'l']}" width="52" height="52" alt="" style="float:right">${S.biz?`<h2 style="margin:0 0 4px">${esc(S.biz)}</h2>`:''}<h2>Recibo de pago N.º ${num}</h2><table><tr><td>Fecha del pago</td><td><b>${p.date}</b></td></tr><tr><td>Recibido de</td><td><b>${esc(c.nombre)}</b></td></tr><tr><td>Documento</td><td>${esc(c.doc)||'—'}</td></tr><tr><td>Préstamo</td><td>${fmt(l.monto)} al ${l.tasa}% mensual, ${l.n} cuotas ${FN[l.freq].toLowerCase()}s</td></tr><tr><td>Valor recibido</td><td><b style="font-size:1.3rem">${fmt(p.amt)}</b></td></tr><tr><td>Total pagado a la fecha</td><td>${fmt(upto)}</td></tr><tr><td>Saldo pendiente</td><td><b>${fmt(Math.max(0,s.total-upto))}</b></td></tr></table><div class="firma">Firma del prestamista</div></div><p class="noprint"><button class="btn" id="rp">Imprimir</button> <a class="btn ghost" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${wa}">Enviar por WhatsApp</a> <button class="btn ghost" id="rx">Cerrar</button></p>`;
  document.body.classList.add('rcp');r.showModal();
  const end=()=>{document.body.classList.remove('rcp');r.close()};
  $('#rx').onclick=end;r.onclose=()=>document.body.classList.remove('rcp');
  $('#rp').onclick=()=>window.print();
}
function reportes(){
  const by={},mes={};
  S.loans.forEach(l=>{const s=sched(l),c=by[l.client]=by[l.client]||{p:0,r:0,s:0};c.p+=+l.monto;c.r+=s.paid;c.s+=s.saldo;
    s.rows.forEach(r=>{const m=r.date.slice(0,7);mes[m]=(mes[m]||0)+(r.tot?r.paid*r.int/r.tot:0)})});
  const tsv='Cliente\tPrestado\tPagado\tSaldo\n'+Object.entries(by).map(([k,v])=>[cname(k),Math.round(v.p),Math.round(v.r),Math.round(v.s)].join('\t')).join('\n');
  $('#v').innerHTML=`<div class="card"><h2>Cartera por cliente</h2>${Object.keys(by).length?`<div class="wrap"><table><tr><th>Cliente</th><th class="n">Prestado</th><th class="n">Pagado</th><th class="n">Saldo</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(cname(k))}</td><td class="n">${fmt(v.p)}</td><td class="n">${fmt(v.r)}</td><td class="n">${fmt(v.s)}</td></tr>`).join('')}</table></div>`:'<p class="empty">Sin datos todavía.</p>'}</div>
  <div class="card"><h2>Ganancias por mes (intereses cobrados)</h2>${Object.keys(mes).length?`<div class="wrap"><table><tr><th>Mes</th><th class="n">Intereses</th></tr>${Object.keys(mes).sort().map(m=>`<tr><td>${m}</td><td class="n">${fmt(mes[m])}</td></tr>`).join('')}</table></div>`:'<p class="empty">Sin datos todavía.</p>'}</div>
  <div class="card"><p class="note">Último respaldo: ${S.lastBackup||'nunca'}. Guarda el archivo en tu correo o Drive para no perder tu cartera.</p><button class="btn" id="bk">Exportar respaldo</button> <button class="btn ghost" id="im">Importar respaldo</button><input type="file" id="fi" accept=".json,application/json" hidden> <button class="btn ghost" id="cp">Copiar para Excel</button> <button class="btn ghost" id="pr">Imprimir o guardar PDF</button> <button class="btn ghost" id="rs">Borrar todos los datos</button></div>`;
  $('#bk').onclick=()=>{S.lastBackup=today();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='cartera-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);reportes()};
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.clients)||!Array.isArray(d.loans)||!Array.isArray(d.pays))throw 0;if(confirm('Se reemplazarán los datos actuales por el respaldo ('+d.clients.length+' clientes, '+d.loans.length+' préstamos). ¿Continuar?')){S=migrate(d);save();applyTheme();render()}}catch(x){alert('El archivo no es un respaldo válido.')}};r.readAsText(f)};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(tsv);alert('Copiado. Pégalo en Excel.')}catch(e){alert('No se pudo copiar.')}};
  $('#pr').onclick=()=>window.print();
  $('#rs').onclick=()=>{if(confirm('Se borrarán todos los clientes, préstamos y pagos de este navegador.')){S=migrate({cfg:S.cfg});save();render()}};
}
function capStats(){const L=S.loans.map(sched),sm=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const ap=sm(S.cap.filter(x=>x.tipo==='aporte'),x=>+x.amt),rt=sm(S.cap.filter(x=>x.tipo==='retiro'),x=>+x.amt),prest=sm(S.loans,l=>+l.monto),rec=sm(L,s=>s.paid),gan=sm(L,s=>s.intPaid),pend=sm(L,s=>s.intTot-s.intPaid);
  const ini=S.cap.filter(x=>x.tipo==='aporte').sort((a,b)=>a.date.localeCompare(b.date))[0];
  return{ap,rt,prest,gan,pend,ini:ini?+ini.amt:0,caja:ap-rt-prest+rec,calle:prest-(rec-gan)}}
function capital(){
  const c=capStats(),st=(b,t,x)=>`<div class="card stat ${x||''}"><b>${fmt(b)}</b><span>${t}</span></div>`;
  const ev=[...S.cap.map(x=>({d:x.date,o:x.tipo==='aporte'?0:1,t:(x.tipo==='aporte'?'Aporte de capital':'Retiro de capital')+(x.nota?' · '+esc(x.nota):''),v:x.tipo==='aporte'?+x.amt:-x.amt,id:x.id})),
    ...S.loans.map(l=>({d:l.fecha,o:2,t:'Préstamo a '+esc(cname(l.client)),v:-l.monto})),
    ...S.pays.map(p=>{const l=S.loans.find(x=>x.id===p.loan);return{d:p.date,o:3,t:'Pago de '+esc(l?cname(l.client):'cliente'),v:+p.amt}})].sort((a,b)=>a.d.localeCompare(b.d)||a.o-b.o);
  let run=0;ev.forEach(e=>{run+=e.v;e.s=run});
  $('#v').innerHTML=`<div class="grid">${st(c.ini,'Capital inicial (primer aporte)')}${st(c.ap-c.rt,'Capital aportado (aportes menos retiros)')}${st(c.prest,'Prestado hasta hoy')}${st(c.caja,'Disponible para prestar',c.caja<0?'bad':'')}${st(c.calle,'Capital en la calle')}${st(c.gan,'Ganancia cobrada (intereses)')}${st(c.pend,'Ganancia por cobrar')}${st(c.caja+c.calle,'Total de tu cartera (caja + calle)')}</div>
  <div class="card"><h2>Alimentar la cartera con capital</h2><form id="fcap"><label>Movimiento<select name="tipo"><option value="aporte">Aporte (entra capital)</option><option value="retiro">Retiro (sale capital)</option></select></label><label>Valor ($)<input name="amt" type="number" min="1" step="any" required></label><label>Fecha<input name="date" type="date" value="${today()}" required></label><label>Nota (opcional)<input name="nota"></label><div class="full"><button class="btn">Guardar movimiento</button></div></form></div>
  <div class="card"><h2>Movimiento de caja</h2>${ev.length?`<div class="wrap"><table><tr><th>Fecha</th><th>Concepto</th><th class="n">Valor</th><th class="n">Disponible</th><th></th></tr>${ev.slice().reverse().slice(0,80).map(e=>`<tr><td>${e.d}</td><td>${e.t}</td><td class="n" style="color:${e.v<0?'var(--bad)':'var(--ok)'}">${e.v<0?'-':'+'}${fmt(Math.abs(e.v))}</td><td class="n">${fmt(e.s)}</td><td>${e.id?`<a class="lk" data-dc="${e.id}">Eliminar</a>`:''}</td></tr>`).join('')}</table></div>`:'<p class="empty">Registra tu primer aporte para empezar a controlar tu capital.</p>'}</div>`;
  $('#fcap').onsubmit=ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));S.cap.push({id:uid(),tipo:f.tipo,amt:+f.amt,date:f.date,nota:f.nota});save();capital()};
  document.querySelectorAll('[data-dc]').forEach(a=>a.onclick=()=>{if(confirm('¿Eliminar este movimiento?')){S.cap=S.cap.filter(x=>x.id!==a.dataset.dc);save();capital()}});
}
function ajustes(){
  const c=S.cfg,AC={verde:'#14594a',azul:'#1f5fbf',violeta:'#6d3fc0',rosa:'#c2255c',naranja:'#c25b00'},op=(a,v)=>a.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('');
  $('#v').innerHTML=`<div class="card"><h2>Apariencia</h2><form id="fa"><label>Tema<select name="theme">${op([['auto','Automático (el del dispositivo)'],['light','Claro'],['dark','Oscuro']],c.theme)}</select></label><label>Fondo<select name="bg">${op([['liso','Liso'],['degradado','Degradado'],['cuadricula','Cuadrícula']],c.bg)}</select></label><div class="full"><span class="note">Color principal</span><div class="sw">${Object.entries(AC).map(([k,v])=>`<button type="button" class="swb ${c.accent===k?'on':''}" data-ac="${k}" style="background:${v}" title="${k}" aria-label="${k}"></button>`).join('')}</div></div></form></div>
  <div class="card"><h2>Avisos</h2><p class="note">Recibe una notificación un día antes de cada cobro. Funciona mientras la app esté abierta o instalada en el dispositivo.</p>${'Notification'in window?(c.notif&&Notification.permission==='granted'?'<p><b>Avisos activados.</b></p><button class="btn ghost" id="nf">Desactivar avisos</button>':'<button class="btn" id="nf">Activar avisos</button>'):'<p class="note">Tu navegador no admite notificaciones.</p>'}</div>
  <div class="card"><h2>Seguridad</h2><p class="note">Protege el acceso a la app en este dispositivo. El código de 4 a 6 dígitos sirve para recuperar la contraseña. Los respaldos .json no van cifrados.</p>${SEC?`<form id="fs"><label>Contraseña actual<input type="password" name="o" required></label><label>Nueva contraseña (mín. 4)<input type="password" name="p" minlength="4" required></label><label>Nuevo código de recuperación (4 a 6 dígitos)<input name="c" inputmode="numeric" pattern="[0-9]{4,6}" required></label><div class="full"><button class="btn">Guardar cambios</button> <button type="button" class="btn ghost" id="lk">Bloquear ahora</button> <button type="button" class="btn ghost" id="rm">Quitar contraseña</button></div></form>`:`<form id="fs"><label>Contraseña (mín. 4)<input type="password" name="p" minlength="4" required></label><label>Código de recuperación (4 a 6 dígitos)<input name="c" inputmode="numeric" pattern="[0-9]{4,6}" required></label><div class="full"><button class="btn">Activar contraseña</button></div></form>`}</div>
  ${installHtml(true)}
  <div class="card"><h2>Diagnóstico de instalación</h2><div id="dg" class="note dg">Comprobando…</div></div>
  <div class="card"><h2>Acerca de</h2><p class="note">Préstamos y Cobros · versión ${APPV}. Tus datos se conservan cuando reemplazas el archivo por una versión nueva. Antes de actualizar, exporta un respaldo desde Reportes.</p></div>`;
  bindInstall();diag();$('#fa').onchange=e=>{if(e.target.name){c[e.target.name]=e.target.value;save();applyTheme()}};
  document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{c.accent=b.dataset.ac;save();applyTheme();ajustes()});
  const nf=$('#nf');if(nf)nf.onclick=()=>{if(c.notif){c.notif=false;save();ajustes()}else enableNotif()};
  $('#fs').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));
    if(!/^\d{4,6}$/.test(f.c)){alert('El código debe tener de 4 a 6 dígitos.');return}
    if(SEC&&await hs(f.o,SEC.salt,SEC.alg)!==SEC.h){alert('La contraseña actual no es correcta.');return}
    await setSec(f.p,f.c);sessionStorage.setItem('unl','1');alert('Seguridad guardada.');ajustes()};
  const lk=$('#lk');if(lk)lk.onclick=()=>{sessionStorage.removeItem('unl');location.reload()};
  const rm=$('#rm');if(rm)rm.onclick=async()=>{const o=prompt('Escribe tu contraseña actual para quitarla:');if(o===null)return;if(await hs(o,SEC.salt,SEC.alg)===SEC.h){localStorage.removeItem(SK);SEC=null;sessionStorage.removeItem('unl');ajustes()}else alert('Contraseña incorrecta.')};
}
function lock(mode){
  const L=$('#lock');L.hidden=false;document.body.classList.add('locked');
  L.innerHTML=`<div class="lbox"><img src="${IC[curMode()==='dark'?'d':'l']}" width="84" height="84" alt=""><h2>Mi cartera de préstamos</h2>${mode==='in'?`<form id="lf"><label>Contraseña<input type="password" name="p" autocomplete="current-password" required></label><button class="btn">Entrar</button><a class="lk" id="fg">Olvidé mi contraseña</a><p class="note" id="lm"></p></form>`:`<form id="lf"><label>Código de recuperación (4 a 6 dígitos)<input name="c" inputmode="numeric" pattern="[0-9]{4,6}" required></label><label>Nueva contraseña (mín. 4)<input type="password" name="p" minlength="4" required></label><button class="btn">Restablecer</button><a class="lk" id="fg">Volver</a><p class="note" id="lm"></p></form>`}</div>`;
  $('#fg').onclick=()=>lock(mode==='in'?'rec':'in');
  $('#lf').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),m=$('#lm');
    if(mode==='in'){if(await hs(f.p,SEC.salt,SEC.alg)===SEC.h){sessionStorage.setItem('unl','1');unlock()}else m.textContent='Contraseña incorrecta.'}
    else if(await hs(f.c,SEC.salt,SEC.alg)===SEC.r){await setSec(f.p,f.c);sessionStorage.setItem('unl','1');unlock()}else m.textContent='Código incorrecto.'};
}
function unlock(){$('#lock').hidden=true;document.body.classList.remove('locked');render();startAlerts()}
function boot(){applyTheme();let nb=0;const bt=setInterval(()=>{const l=$('#lock');if(++nb>40||isApp())return clearInterval(bt);if(l&&l.hidden){showBanner();if($('#ib')||(!DIP&&!/iphone|ipad|ipod/i.test(navigator.userAgent)&&nb>5))clearInterval(bt)}},1500);$('#tg').onclick=toggleTheme;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});let u=false;try{u=sessionStorage.getItem('unl')}catch(e){}if(SEC&&!u)lock('in');else unlock()}
document.addEventListener('input',e=>{if(e.target.id==='biz'){S.biz=e.target.value;save()}});
boot();
</script>
</body>
</html>
